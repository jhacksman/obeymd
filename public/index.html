<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="make money, do whatever it takes">
    <title>obey.md</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #fff;
        color: #111;
        font-family: "Courier New", Courier, monospace;
      }
      main {
        min-height: 100svh;
        max-width: 1000px;
        margin: 0 auto;
        padding: clamp(24px, 6vw, 80px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 96px;
      }
      p {
        margin: 0;
        font-size: clamp(16px, 2.3vw, 22px);
        line-height: 1.6;
      }
      pre {
        margin: 0;
        font: 900 clamp(9px, 1.9vw, 22px)/1.15 "Courier New", Courier, monospace;
        white-space: pre;
      }
      @media (max-width: 480px) {
        main { min-height: 85svh; }
      }
    </style>
  </head>

</html>
